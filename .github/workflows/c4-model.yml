# A C4 Context and a C4 Component diagram, kept where a reader finds them
# (macula-io/macula-codebase-checks#10; Raf's rule of 2026-10-19).
#
# The shared workflow resolves the two diagrams in assets/ and checks that a
# README a reader reaches from the front page shows each one, so a commit that
# drops a diagram or its link fails here. The check lives in the shared workflow
# rather than in this repository, because a reusable workflow runs here with this
# tree and the rule is the same in every repository that carries it.
#
# ITS OWN WORKFLOW, WITH NO PATH FILTER. check.yml runs on pushes to main and on
# pull requests, so a branch push that only touches the diagrams or a README
# would never reach it. This runs on every branch push and every pull request,
# and builds nothing.
name: c4 model

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c4-model:
    permissions:
      contents: read
    uses: macula-io/macula-ci-images/.github/workflows/c4-model.yml@40c349dfdd8063321f6d8de571d6fc6ee165729d
